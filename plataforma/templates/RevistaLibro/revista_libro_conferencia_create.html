{% extends "base.html" %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/forms.css' %}">
{% endblock %}

{% block content %}
<div class="content">
  <div class="content">
    <div class="col">
      <div class="container-form">
        <div class="form">
          <div class="container-fluid py-4">
            <div class="row">
              <div class="col-md-12">
                <div class="card">
                  <div class="title">
                    <h3 class="title-text p-3">Nueva Revista</h3>
                  </div>
                  <form id="formu" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="card-body">
                      <div class="col-md-12">
                        <div class="seccion-formulario">
                          <h5>Datos de la Revista</h5>
                          <div class="row">
                            <div class="col-md-6">
                              <div class="form-group icon-input">
                                <label class="form-control-label required-field">Nombre</label>
                                <div class="input-wrapper">
                                  {{form.titulo}}
                                </div>
                              </div>
                            </div>
                            <div class="col-md-6">
                              <div class="form-group icon-input">
                                <label class="form-control-label required-field">Editorial</label>
                                <div class="input-wrapper">
                                  {{form.editorial}}
                                </div>
                              </div>
                            </div>
                            <div class="col-md-6">
                              <div class="form-group icon-input">
                                <label class="form-control-label required-field">ISSN</label>
                                <div class="input-wrapper">
                                  {{form.issn}}
                                </div>
                              </div>
                            </div>
                            <div class="col-md-6">
                              <div class="form-group icon-input">
                                <label class="form-control-label required-field">URL</label>
                                <div class="input-wrapper">
                                  {{form.url}}
                                </div>
                              </div>
                            </div>
                            <div class="col-md-6">
                              <div class="form-group icon-input">
                                <label class="form-control-label required-field">Pais</label>
                                <div class="input-wrapper">
                                  {{form.pais}}
                                </div>
                              </div>
                            </div>
                            <div class="col-md-6">
                              <div class="form-group icon-input">
                                <label class="form-control-label required-field">Indexación</label>
                                <div class="input-wrapper">
                                  {{form.index}}
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="row mt-4">
                      <div class="col-md-12 text-center">
                        <a href="{% url 'Revista_Libro_Conferencia_List' %}" class="btn btn-cancelar ml-3">Cancelar</a>
                        <button type="submit" class="btn boton-form"><i class="fas fa-check"></i>
                          Guardar</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  {% endblock %}

  {% block js %}
  <script src="{% static 'js/validations.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      // Validación de formulario
      const form = document.getElementById('formu');

      form.addEventListener('submit', function (event) {
        let isValid = true;

        // Validar título
        const titulo = document.getElementById('id_titulo');
        if (!titulo.value.trim()) {
          isValid = false;
          titulo.classList.add('is-invalid');
        } else {
          titulo.classList.remove('is-invalid');
        }

        // Validar editorial
        const editorial = document.getElementById('id_editorial');
        if (!editorial.value.trim()) {
          isValid = false;
          editorial.classList.add('is-invalid');
        } else {
          editorial.classList.remove('is-invalid');
        }

        // Validar ISSN (si se proporciona)
        const issn = document.getElementById('id_issn');
        if (issn.value.trim() && !/^\d{4}-\d{4}$/.test(issn.value.trim())) {
          isValid = false;
          issn.classList.add('is-invalid');
        } else {
          issn.classList.remove('is-invalid');
        }

        // Validar ISBN (si se proporciona)
        const isbn = document.getElementById('id_isbn');
        if (isbn.value.trim() && !/^(?:\d{10}|\d{13})$/.test(isbn.value.trim().replace(/-/g, ''))) {
          isValid = false;
          isbn.classList.add('is-invalid');
        } else {
          isbn.classList.remove('is-invalid');
        }

        if (!isValid) {
          event.preventDefault();
          const errorContainer = document.getElementById('error-container');
          errorContainer.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
              Por favor, corrija los errores en el formulario antes de continuar.
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          `;
        }
      });
    });
  </script>
  {% endblock %}
