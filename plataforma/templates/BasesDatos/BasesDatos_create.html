{% extends "base.html" %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/forms.css' %}">
{% endblock %}

{% block content %}
<div class="content">
    <div class="col">
        <div class="container-form">
            <div class="form">
                <div class="container-fluid py-4">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="card">
                                <div class="title">
                                    <h3 class="title-text p-3">Nueva Indexación de Revista</h3>
                                </div>
                                <form action="." method="POST" id="bases-datos-form">
                                    {% csrf_token %}
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-12">
                                                <div class="seccion-formulario">
                                                    <h5>Datos de la Indexación</h5>
                                                    <div class="row">
                                                        <div class="col-md-12">
                                                            <div class="form-group icon-input">
                                                                <label
                                                                    class="form-control-label required-field">Nombre</label>
                                                                <div class="input-wrapper">
                                                                    {{form.nombre_base_datos}}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-12">
                                                            <div class="form-group icon-input">
                                                                <label
                                                                    class="form-control-label required-field">Grupo</label>
                                                                <div class="input-wrapper">
                                                                    {{form.grupo}}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-12">
                                                            <div class="form-group icon-input">
                                                                <label
                                                                    class="form-control-label required-field">URL</label>
                                                                <div class="input-wrapper">
                                                                    {{form.url}}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row mt-4">
                                        <div class="col-md-12 text-center">
                                            <a href="{% url 'BasesDatosList' %}"
                                                class="btn btn-cancelar ml-3">Cancelar</a>
                                            <button type="submit" class="btn boton-form"><i class="fas fa-check"></i>
                                                Guardar</button>
                                        </div>
                                    </div>
                                </form>

                            </div>
                        </div>
                        {% endblock %}

                        <!-- Container JS -->
                        {% block js %}
                        <script src="{% static 'Plataforma/js/FormularioSelect.js' %}"></script>
                        <script>
                            $(document).ready(function () {
                                // Form validation
                                $('#bases-datos-form').on('submit', function (e) {
                                    let isValid = true;
                                    const nombre = $('#id_nombre_base_datos').val().trim();
                                    const grupo = $('#id_grupo').val();
                                    const url = $('#id_url').val().trim();

                                    // Clear previous errors
                                    $('.error-message').text('');

                                    // Validate nombre_base_datos
                                    if (nombre === '') {
                                        $('#nombre-error').text('Este campo es obligatorio');
                                        isValid = false;
                                    } else if (nombre.length > 50) {
                                        $('#nombre-error').text('El nombre no puede exceder los 50 caracteres');
                                        isValid = false;
                                    }

                                    // Validate grupo
                                    if (grupo === 'Seleccione...') {
                                        $('#grupo-error').text('Debe seleccionar un grupo');
                                        isValid = false;
                                    }

                                    // Validate URL
                                    if (url === '') {
                                        $('#url-error').text('Este campo es obligatorio');
                                        isValid = false;
                                    } else if (url.length > 200) {
                                        $('#url-error').text('La URL no puede exceder los 200 caracteres');
                                        isValid = false;
                                    } else if (!isValidURL(url)) {
                                        $('#url-error').text('Ingrese una URL válida');
                                        isValid = false;
                                    }

                                    if (!isValid) {
                                        e.preventDefault();
                                    }
                                });

                                // URL validation function
                                function isValidURL(url) {
                                    try {
                                        new URL(url);
                                        return true;
                                    } catch (_) {
                                        return false;
                                    }
                                }

                                // Input animation
                                const inputs = document.querySelectorAll(".input");

                                function focusFunc() {
                                    let parent = this.parentNode;
                                    parent.classList.add("focus");
                                }

                                function blurFunc() {
                                    let parent = this.parentNode;
                                    if (this.value == "") {
                                        parent.classList.remove("focus");
                                    }
                                }

                                inputs.forEach((input) => {
                                    input.addEventListener("focus", focusFunc);
                                    input.addEventListener("blur", blurFunc);
                                });

                                // Initialize select fields with focus if they have a value
                                if ($('#id_grupo').val() !== 'Seleccione...') {
                                    $('#id_grupo').parent().addClass('focus');
                                }
                            });
                        </script>
                        {% endblock %}
                        <!-- End Container JS -->
